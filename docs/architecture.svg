<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title description">
  <title id="title">顶级吸引力三重奏架构</title>
  <desc id="description">用户提供场景与事实，Skill 判断问题层级，按需读取三个模块，给出判断、行动、观察和边界。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21334b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#8ea4be" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="960" height="550" rx="18" fill="#0b1424"/>
  <rect x="1" y="1" width="958" height="548" rx="17" fill="url(#grid)" stroke="#263a53" opacity=".72"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="48" y="62" fill="#f1f5f9" font-size="29" font-weight="700">顶级吸引力三重奏</text>
    <text x="48" y="95" fill="#a4b7cd" font-size="17">从具体情境到一个可执行的下一步</text>

    <g fill="none" stroke="#8ea4be" stroke-width="1.6">
      <path d="M423 163h114" marker-end="url(#arrow)"/>
      <path d="M724 195v35H170v36M480 230v36M724 230h66v36"/>
      <path d="M170 360v30H790v-30M480 360v63" marker-end="url(#arrow)"/>
    </g>

    <g fill="#102037" stroke="#506987">
      <rect x="48" y="131" width="375" height="64" rx="10"/>
      <rect x="537" y="131" width="375" height="64" rx="10"/>
    </g>
    <g font-size="17" fill="#e7eef8" text-anchor="middle">
      <text x="235.5" y="169">提供场景、近期互动和想要的结果</text>
      <text x="724.5" y="169">判断问题层级，区分事实与推测</text>
    </g>

    <rect x="48" y="266" width="244" height="94" rx="12" fill="#103344" stroke="#22d3ee"/>
    <rect x="358" y="266" width="244" height="94" rx="12" fill="#252445" stroke="#a78bfa"/>
    <rect x="668" y="266" width="244" height="94" rx="12" fill="#113831" stroke="#34d399"/>
    <g font-weight="700" font-size="23" text-anchor="middle">
      <text x="170" y="303" fill="#89eaff">内在基础</text>
      <text x="480" y="303" fill="#d2c4ff">互动判断</text>
      <text x="790" y="303" fill="#92efc7">行动推进</text>
    </g>
    <g fill="#d0dceb" font-size="16" text-anchor="middle">
      <text x="170" y="333">自尊、情绪和生活重心</text>
      <text x="480" y="333">情境、互惠和信任</text>
      <text x="790" y="333">开场、邀约或退出</text>
    </g>

    <rect x="48" y="425" width="864" height="75" rx="12" fill="#13243a" stroke="#506987"/>
    <text x="480" y="455" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="700">判断 · 行动 · 观察 · 边界</text>
    <text x="480" y="480" text-anchor="middle" fill="#b5c7dd" font-size="15">给出一句可用的表达、值得观察的回应和明确的停止条件</text>
  </g>
</svg>
